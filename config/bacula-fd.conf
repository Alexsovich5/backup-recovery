#
# Bacula File Daemon configuration for client server01 (template, see
# scripts/render-config.sh)
#

# The Director allowed to contact this client.
Director {
  Name = backup-dir
  Password = "@FD_PASSWORD@"
}

FileDaemon {
  Name = server01-fd
  FDport = 9102
  WorkingDirectory = /var/lib/bacula
  Pid Directory = /var/run/bacula
  Maximum Concurrent Jobs = 20
  # Data is signed and encrypted with the client keypair before it leaves
  # the client. The master recovery cert lets the master key decrypt it too.
  PKI Signatures = yes
  PKI Encryption = yes
  PKI Keypair = "@KEY_DIR@/server01.pem"
  PKI Master Key = "@KEY_DIR@/master.cert"
}

Messages {
  Name = Standard
  director = backup-dir = all, !skipped, !restored
}
