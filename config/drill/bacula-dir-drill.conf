#
# Scratch Director for the disaster-recovery drill (template, rendered by
# scripts/dr-drill.sh). It runs on the recovered catalog bacula_drill and
# talks only to drill-sd (on this host) and drill-fd (the recovery host
# @DRFD_HOST@, the only holder of the master key).
#
#   @DRILL_DIR@          scratch directory of the drill run
#   @DRILL_PASSWORD@     per-run password of drill-dir, drill-sd and bconsole
#   @DRFD_PASSWORD@      password drill-fd expects from drill-dir
#   @DRILL_SD_HOST@      host of drill-sd, as drill-fd reaches it
#   @DB_USER@            catalog account, with rights on bacula_drill only
#   @DRILL_RESTORE_DIR@  directory on drill-fd that receives the restore
#

Director {
  Name = drill-dir
  DIRport = 9201
  DirAddress = 127.0.0.1
  QueryFile = "/etc/bacula/scripts/query.sql"
  WorkingDirectory = "@DRILL_DIR@/work"
  PidDirectory = "@DRILL_DIR@/work"
  Maximum Concurrent Jobs = 1
  Password = "@DRILL_PASSWORD@"
  Messages = Daemon
}

Job {
  Name = "RestoreFiles"
  Type = Restore
  Client = drill-fd
  FileSet = "ServerFileSet"
  Storage = File
  Pool = Default
  Messages = Standard
  Where = @DRILL_RESTORE_DIR@
}

# Same name as the live FileSet, so the restore finds server01's jobs.
FileSet {
  Name = "ServerFileSet"
  Include {
    Options {
      signature = MD5
    }
    File = /srv/data
    File = /etc
  }
}

# server01's backups are recorded in the catalog under this Client. It is
# never contacted: nothing listens on port 9200 of 127.0.0.1.
Client {
  Name = server01-fd
  Address = 127.0.0.1
  FDPort = 9200
  Catalog = DrillCatalog
  Password = "@DRILL_PASSWORD@"
  AutoPrune = no
}

# The recovery File Daemon, holding only the master key.
Client {
  Name = drill-fd
  Address = @DRFD_HOST@
  FDPort = 9202
  Catalog = DrillCatalog
  Password = "@DRFD_PASSWORD@"
  AutoPrune = no
}

# drill-fd connects back to drill-sd on this host for the restore data.
Storage {
  Name = File
  Address = @DRILL_SD_HOST@
  SDPort = 9203
  Password = "@DRILL_PASSWORD@"
  Device = FileStorage
  Media Type = File
}

Catalog {
  Name = DrillCatalog
  DB Name = "bacula_drill"
  DB Address = "@DB_HOST@"
  DB Port = 3306
  DB User = "@DB_USER@"
  DB Password = "@DB_PASSWORD@"
}

Pool {
  Name = Default
  Pool Type = Backup
  AutoPrune = no
  Label Format = "Default-"
}

Messages {
  Name = Standard
  console = all, !skipped, !saved
  append = "@DRILL_DIR@/drill-dir.log" = all, !skipped
  catalog = all
}

Messages {
  Name = Daemon
  console = all, !skipped, !saved
  append = "@DRILL_DIR@/drill-dir.log" = all, !skipped
}
