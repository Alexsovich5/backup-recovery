#
# Scratch Storage Daemon for the disaster-recovery drill (template,
# rendered by scripts/dr-drill.sh). Its device reads the drill's copy of
# the offsite volumes. bextract -c uses this file too.
#

Storage {
  Name = drill-sd
  SDPort = 9203
  SDAddress = 127.0.0.1
  WorkingDirectory = "@DRILL_DIR@/work"
  Pid Directory = "@DRILL_DIR@/work"
  Maximum Concurrent Jobs = 5
}

Director {
  Name = drill-dir
  Password = "@DRILL_PASSWORD@"
}

Device {
  Name = FileStorage
  Media Type = File
  Archive Device = @DRILL_DIR@/volumes
  LabelMedia = no
  Random Access = yes
  AutomaticMount = yes
  RemovableMedia = no
  AlwaysOpen = no
}

Messages {
  Name = Standard
  director = drill-dir = all
}
