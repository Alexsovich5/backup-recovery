#
# File Daemon of the recovery host for the disaster-recovery drill
# (template, rendered by docker/entrypoint-drclient.sh on the dr-client
# service). Its only key is the master recovery keypair, which never
# leaves that host. bacula-fd 5.2.6 loads the keypair as a decryption key
# only when PKI Encryption (or PKI Signatures) is on, hence
# "PKI Encryption = yes" although this daemon never backs anything up.
# Signatures made with server01's own key have no matching signer here;
# 5.2.6 logs that at debug level only and restores the data.
#
#   @KEY_DIR@        directory holding master.pem
#   @DRFD_PASSWORD@  password drill-dir uses to contact this daemon
#

Director {
  Name = drill-dir
  Password = "@DRFD_PASSWORD@"
}

FileDaemon {
  Name = drill-fd
  FDport = 9202
  WorkingDirectory = /var/lib/bacula
  Pid Directory = /var/run/bacula
  Maximum Concurrent Jobs = 5
  PKI Encryption = yes
  PKI Keypair = "@KEY_DIR@/master.pem"
}

Messages {
  Name = Standard
  director = drill-dir = all, !skipped, !restored
}
