#
# Scratch File Daemon for the disaster-recovery drill (template, rendered
# by scripts/dr-drill.sh). It holds only the master recovery key and
# certificate as its keypair. bacula-fd 5.2.6 loads the keypair as a
# decryption key only when PKI Encryption (or PKI Signatures) is on, hence
# "PKI Encryption = yes" although this daemon never backs anything up.
# Signatures made with server01's own key have no matching signer here;
# 5.2.6 logs that at debug level only and restores the data.
#

Director {
  Name = drill-dir
  Password = "@DRILL_PASSWORD@"
}

FileDaemon {
  Name = drill-fd
  FDport = 9202
  FDAddress = 127.0.0.1
  WorkingDirectory = "@DRILL_DIR@/work"
  Pid Directory = "@DRILL_DIR@/work"
  Maximum Concurrent Jobs = 5
  PKI Encryption = yes
  PKI Keypair = "@DRILL_DIR@/master.pem"
}

Messages {
  Name = Standard
  director = drill-dir = all, !skipped, !restored
}
