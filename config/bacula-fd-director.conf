#
# Bacula File Daemon configuration for backup-fd, the client on the
# director/storage host (template, see scripts/render-config.sh).
# It backs up local files such as the catalog dump and carries no PKI
# directives.
#

# The Director allowed to contact this client.
Director {
  Name = backup-dir
  Password = "@FD_PASSWORD@"
}

FileDaemon {
  Name = backup-fd
  FDport = 9102
  WorkingDirectory = /var/lib/bacula
  Pid Directory = /var/run/bacula
  Maximum Concurrent Jobs = 20
}

Messages {
  Name = Standard
  director = backup-dir = all, !skipped, !restored
}
