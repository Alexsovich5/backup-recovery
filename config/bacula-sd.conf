#
# Bacula Storage Daemon configuration (template, see scripts/render-config.sh)
#

Storage {
  Name = backup-sd
  SDPort = 9103
  WorkingDirectory = "/var/lib/bacula"
  Pid Directory = "/var/run/bacula"
  Maximum Concurrent Jobs = 20
}

# The Director allowed to use this Storage Daemon.
Director {
  Name = backup-dir
  Password = "@SD_PASSWORD@"
}

# Disk volumes stand in for a tape library.
Device {
  Name = FileStorage
  Media Type = File
  Archive Device = /var/lib/bacula/volumes
  LabelMedia = yes
  Random Access = yes
  AutomaticMount = yes
  RemovableMedia = no
  AlwaysOpen = no
}

Messages {
  Name = Standard
  director = backup-dir = all
}
