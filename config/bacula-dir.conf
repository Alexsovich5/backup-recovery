#
# Bacula Director configuration (template, see scripts/render-config.sh)
#

Director {
  Name = backup-dir
  DIRport = 9101
  QueryFile = "/etc/bacula/scripts/query.sql"
  WorkingDirectory = "/var/lib/bacula"
  PidDirectory = "/var/run/bacula"
  # One job at a time keeps job order (backup, then verify) deterministic.
  Maximum Concurrent Jobs = 1
  Password = "@DIR_PASSWORD@"
  Messages = Daemon
}

# Job Definitions. No Schedule here: every job inheriting it would run.
JobDefs {
  Name = "DefaultJob"
  Type = Backup
  Level = Incremental
  Client = server01-fd
  FileSet = "ServerFileSet"
  Storage = File
  Messages = Standard
  Pool = Default
  Priority = 10
  Write Bootstrap = "/var/lib/bacula/%c.bsr"
}

# Scheduled nightly backup of server01. The level comes from the
# WeeklyCycle Run line and selects the matching pool.
Job {
  Name = "server01-backup"
  JobDefs = "DefaultJob"
  Client = server01-fd
  Schedule = "WeeklyCycle"
  Full Backup Pool = FullPool
  Differential Backup Pool = DifferentialPool
  Incremental Backup Pool = IncrementalPool
}

# On-demand backup jobs (scripts/backup.sh), not scheduled.
Job {
  Name = "server01-full"
  JobDefs = "DefaultJob"
  Client = server01-fd
  Level = Full
  Pool = FullPool
}

Job {
  Name = "server01-incremental"
  JobDefs = "DefaultJob"
  Client = server01-fd
  Level = Incremental
  Pool = IncrementalPool
}

Job {
  Name = "server01-differential"
  JobDefs = "DefaultJob"
  Client = server01-fd
  Level = Differential
  Pool = DifferentialPool
}

# Verify Jobs: read the volumes back and compare with the catalog.
Job {
  Name = "Verify-server01"
  Type = Verify
  Level = VolumeToCatalog
  Client = server01-fd
  FileSet = "ServerFileSet"
  Messages = Standard
  Storage = File
  Pool = Default
  Priority = 10
}

# Restore Job
Job {
  Name = "RestoreFiles"
  Type = Restore
  Client = server01-fd
  FileSet = "ServerFileSet"
  Storage = File
  Pool = Default
  Messages = Standard
  Where = /tmp/bacula-restores
}

# FileSet Definitions
FileSet {
  Name = "ServerFileSet"
  Include {
    # Files matching *secret.txt are stored uncompressed. The first
    # matching Options block wins, so this one must come first.
    Options {
      wildfile = "*secret.txt"
      signature = MD5
    }
    Options {
      signature = MD5
      compression = GZIP
    }
    File = /srv/data
    File = /etc
  }
}

# Schedule Definitions
Schedule {
  Name = "WeeklyCycle"
  Run = Full 1st sun at 23:05
  Run = Differential 2nd-5th sun at 23:05
  Run = Incremental mon-sat at 23:05
}

# Client Definitions
Client {
  Name = server01-fd
  Address = @FD_HOST@
  FDPort = 9102
  Catalog = MyCatalog
  Password = "@FD_PASSWORD@"
  File Retention = 60 days
  Job Retention = 6 months
  AutoPrune = yes
}

# File Daemon on the director/storage host itself (no PKI).
Client {
  Name = backup-fd
  Address = @DIR_HOST@
  FDPort = 9102
  Catalog = MyCatalog
  Password = "@FD_PASSWORD@"
  File Retention = 60 days
  Job Retention = 6 months
  AutoPrune = yes
}

# Storage Definitions
Storage {
  Name = File
  Address = @SD_HOST@
  SDPort = 9103
  Password = "@SD_PASSWORD@"
  Device = FileStorage
  Media Type = File
}

# Catalog Definition
Catalog {
  Name = MyCatalog
  DB Name = "bacula"
  DB Address = "@DB_HOST@"
  DB Port = 3306
  DB User = "bacula"
  DB Password = "@DB_PASSWORD@"
}

# Pool Definitions
Pool {
  Name = Default
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 365 days
  Maximum Volume Bytes = 50G
  Maximum Volumes = 100
  Label Format = "Default-"
}

Pool {
  Name = FullPool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 365 days
  Maximum Volume Bytes = 100G
  Maximum Volumes = 50
  Label Format = "Full-"
}

Pool {
  Name = IncrementalPool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 30 days
  Maximum Volume Bytes = 10G
  Maximum Volumes = 200
  Label Format = "Incr-"
}

Pool {
  Name = DifferentialPool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 90 days
  Maximum Volume Bytes = 25G
  Maximum Volumes = 100
  Label Format = "Diff-"
}

# Messages Definition
Messages {
  Name = Standard
  mailcommand = "/usr/sbin/bsmtp -h @SMTP_HOST@ -f \"\(Bacula\) \<%r\>\" -s \"Bacula: %t %e of %c %l\" %r"
  operatorcommand = "/usr/sbin/bsmtp -h @SMTP_HOST@ -f \"\(Bacula\) \<%r\>\" -s \"Bacula: Intervention needed for %j\" %r"
  mail = @ADMIN_EMAIL@ = all, !skipped
  operator = @ADMIN_EMAIL@ = mount
  console = all, !skipped, !saved
  append = "/var/log/bacula/bacula.log" = all, !skipped
  catalog = all
}

Messages {
  Name = Daemon
  mailcommand = "/usr/sbin/bsmtp -h @SMTP_HOST@ -f \"\(Bacula\) \<%r\>\" -s \"Bacula daemon message\" %r"
  mail = @ADMIN_EMAIL@ = all, !skipped
  console = all, !skipped, !saved
  append = "/var/log/bacula/bacula.log" = all, !skipped
}
