#
# Bacula Director Configuration
#

Director {
  Name = example-dir
  DIRport = 9101
  QueryFile = "/etc/bacula/query.sql"
  WorkingDirectory = "/var/lib/bacula"
  PidDirectory = "/var/run"
  Maximum Concurrent Jobs = 10
  Password = "BaculaDirectorPassword123"
  Messages = Daemon
  DirAddress = 192.168.1.100
}

# Job Definitions
JobDefs {
  Name = "ExampleJobDef"
  Type = Backup
  Level = Incremental
  Client = example-fd
  FileSet = "ExampleFileSet"
  Schedule = "ExampleSchedule"
  Storage = File
  Messages = Standard
  Pool = Default
  Priority = 10
  Write Bootstrap = "/var/lib/bacula/%c.bsr"
}

# Server Backup Jobs
Job {
  Name = "server01-full"
  JobDefs = "ExampleJobDef"
  Client = server01-fd
  Level = Full
  Pool = FullPool
}

Job {
  Name = "server01-incremental"
  JobDefs = "ExampleJobDef"
  Client = server01-fd
  Level = Incremental
  Pool = IncrementalPool
}

Job {
  Name = "server01-differential"
  JobDefs = "ExampleJobDef"
  Client = server01-fd
  Level = Differential
  Pool = DifferentialPool
}

# Verify Jobs
Job {
  Name = "Verify-server01"
  Type = Verify
  Level = Catalog
  Client = server01-fd
  FileSet = "ExampleFileSet"
  Messages = Standard
  Storage = File
}

# Restore Job
Job {
  Name = "RestoreFiles"
  Type = Restore
  Client = server01-fd
  FileSet = "ExampleFileSet"
  Storage = File
  Pool = Default
  Messages = Standard
  Where = /tmp/bacula-restores
}

# FileSet Definitions
FileSet {
  Name = "ExampleFileSet"
  Include {
    Options {
      signature = MD5
      compression = GZIP
    }
    File = /home
    File = /etc
    File = /var
    File = /opt
    File = /usr/local
  }
  Exclude {
    File = /var/tmp
    File = /proc
    File = /sys
    File = /dev
    File = /backup
  }
}

# Schedule Definitions
Schedule {
  Name = "ExampleSchedule"
  Run = Full 1st sun at 23:05
  Run = Differential 2nd-5th sun at 23:05
  Run = Incremental mon-sat at 23:05
}

# Client Definitions
Client {
  Name = server01-fd
  Address = 192.168.1.101
  FDPort = 9102
  Catalog = MyCatalog
  Password = "ClientPassword123"
  File Retention = 60 days
  Job Retention = 6 months
  AutoPrune = yes
}

# Storage Definitions
Storage {
  Name = File
  Address = 192.168.1.100
  SDPort = 9103
  Password = "StoragePassword123"
  Device = FileStorage
  Media Type = File
}

# Catalog Definition
Catalog {
  Name = MyCatalog
  DBName = "bacula"
  DBUser = "bacula"
  DBPassword = "BaculaDBPassword123"
}

# Pool Definitions
Pool {
  Name = Default
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 365 days
  Maximum Volume Bytes = 50G
  Maximum Volumes = 100
}

Pool {
  Name = FullPool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 1 year
  Maximum Volume Bytes = 100G
  Maximum Volumes = 50
}

Pool {
  Name = IncrementalPool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 30 days
  Maximum Volume Bytes = 10G
  Maximum Volumes = 200
}

Pool {
  Name = DifferentialPool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 90 days
  Maximum Volume Bytes = 25G
  Maximum Volumes = 100
}

# Messages Definition
Messages {
  Name = Standard
  mailcommand = "/usr/sbin/bsmtp -h localhost -f \"\(Bacula\) \<%r\>\" -s \"Bacula: %t %e of %c %l\" %r"
  operatorcommand = "/usr/sbin/bsmtp -h localhost -f \"\(Bacula\) \<%r\>\" -s \"Bacula: Intervention needed for %j\" %r"
  mail = admin@example.com = all, !skipped
  operator = admin@example.com = mount
  console = all, !skipped, !saved
  append = "/var/log/bacula/bacula.log" = all, !skipped
  catalog = all
}

Messages {
  Name = Daemon
  mailcommand = "/usr/sbin/bsmtp -h localhost -f \"\(Bacula\) \<%r\>\" -s \"Bacula daemon message\" %r"
  mail = admin@example.com = all, !skipped
  console = all, !skipped, !saved
  append = "/var/log/bacula/bacula.log" = all, !skipped
}