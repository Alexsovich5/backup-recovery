#
# rsync daemon configuration of the "offsite" service (template, see
# scripts/render-config.sh). Module "bacula" receives the volumes,
# bootstrap files and catalog dump sent by scripts/offsite-sync.sh.
#

pid file = /var/run/rsyncd.pid
log file = /var/log/rsyncd.log
uid = root
gid = root
use chroot = yes

[bacula]
  path = /offsite
  comment = Offsite copy of Bacula volumes, bootstrap files and catalog dump
  read only = no
  list = yes
