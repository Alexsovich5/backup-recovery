name: backup-recovery

# One image, one entrypoint per service. Each service gets read-only bind
# mounts of only the repo directories it uses (under /src); the image
# itself holds no project scripts. Only the throwaway "tools" container
# mounts the whole repo read-write (make lint writes build/).
#
# Key material is split by volume:
#   keys       server01 only: its own keypair plus the master certificate
#   keysafe    dr-client only: the master recovery keypair
#   masterpub  master.cert (public), written by dr-client, read by server01
# The director (Director, Storage Daemon, backup-fd) holds no private key.

x-base: &base
  image: backup-recovery:wheezy
  working_dir: /src
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  networks:
    - backupnet

services:
  # Throwaway container for lint and unit tests; not started by "up".
  tools:
    <<: *base
    profiles: ["tools"]
    volumes:
      - .:/src

  catalog:
    <<: *base
    hostname: catalog
    entrypoint: ["/src/docker/entrypoint-catalog.sh"]
    volumes:
      - ./docker:/src/docker:ro
      - ./config:/src/config:ro

  smtp:
    <<: *base
    hostname: smtp
    entrypoint: ["/src/docker/entrypoint-smtp.sh"]
    volumes:
      - ./docker:/src/docker:ro
      - maillog:/var/log/smtp-sink

  # Recovery host of the DR drill and the only holder of the master key.
  dr-client:
    <<: *base
    hostname: dr-client
    entrypoint: ["/src/docker/entrypoint-drclient.sh"]
    volumes:
      - ./docker:/src/docker:ro
      - ./config:/src/config:ro
      - ./scripts:/src/scripts:ro
      - keysafe:/etc/bacula/keysafe
      - masterpub:/masterpub
      - drillrestores:/drill-restores

  server01:
    <<: *base
    hostname: server01
    entrypoint: ["/src/docker/entrypoint-client.sh"]
    depends_on:
      - dr-client
    volumes:
      - ./docker:/src/docker:ro
      - ./config:/src/config:ro
      - ./scripts:/src/scripts:ro
      - ./tests/fixtures/data:/src/tests/fixtures/data:ro
      - srvdata:/srv/data
      - restores:/restores
      - keys:/etc/bacula/keys
      - masterpub:/masterpub:ro

  offsite:
    <<: *base
    hostname: offsite
    entrypoint: ["/src/docker/entrypoint-offsite.sh"]
    volumes:
      - ./docker:/src/docker:ro
      - ./config:/src/config:ro
      - ./scripts:/src/scripts:ro
      - offsite:/offsite

  director:
    <<: *base
    hostname: director
    entrypoint: ["/src/docker/entrypoint-director.sh"]
    depends_on:
      - catalog
      - server01
      - dr-client
      - smtp
      - offsite
    volumes:
      - ./docker:/src/docker:ro
      - ./config:/src/config:ro
      - ./scripts:/src/scripts:ro
      - ./bin:/src/bin:ro
      - ./tests:/src/tests:ro
      - srvdata:/clientdata/server01
      - restores:/restores
      - maillog:/var/log/smtp-sink:ro
      - offsite:/offsite:ro
      # Restore target of the DR drill on dr-client, checked from here.
      - drillrestores:/drill-restores

volumes:
  srvdata:
  restores:
  maillog:
  keys:
  keysafe:
  masterpub:
  drillrestores:
  offsite:

networks:
  backupnet:
    ipam:
      config:
        - subnet: 172.44.0.0/24
